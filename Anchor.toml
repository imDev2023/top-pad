# The two programs (spec 5): the fee program and the Fair Open program, on Anchor 1.2.1 (spec 5.1).
# Build with `pnpm programs`, not a bare `anchor build`: it targets SBPF v2, the newest version devnet and mainnet run,
# where Anchor 1.2.1 defaults to v3, which neither has activated (checked 2026-10-27). `cargo build-sbf` fetches
# platform-tools v1.57 into ~/.cache/solana, so the machine's own Solana install is never switched.
skip_local_validator = true

[toolchain]
anchor_version = "1.2.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

# Fixed ids, ground with the product name's prefix (#65): HeatF for the fee program, HeatP for the Fair Open program.
# Their keypairs live only in the gitignored target/deploy on the owner's Mac, backed up in the owner's password
# manager, never in the repo, CI or Cloudflare; a fresh checkout's build makes random ones, so never `anchor keys sync`.
[programs.localnet]
fair_open = "HeatPiBAgiwq6VJr8eqyagQiQ2gvaK2y85q26bbBu4bo"
fee = "HeatFEzySQiaWqxR7cDza9WP2B15AxMfsgSS5p6Bdn97"

[programs.devnet]
fair_open = "HeatPiBAgiwq6VJr8eqyagQiQ2gvaK2y85q26bbBu4bo"
fee = "HeatFEzySQiaWqxR7cDza9WP2B15AxMfsgSS5p6Bdn97"

[provider]
cluster = "devnet"
# The upgrade key, kept offline (spec 10.3); only a deploy reads it.
wallet = "~/.config/top-pad/devnet/upgrade-authority.json"

[scripts]
test = "cargo test"
