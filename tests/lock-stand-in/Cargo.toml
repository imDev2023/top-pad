[package]
name = "lock_stand_in"
version = "0.1.0"
description = "Jupiter Lock's create_vesting_escrow_v2, for the Fair Open program's LiteSVM tests; never deployed"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lock_stand_in"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
