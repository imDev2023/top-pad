[package]
name = "fair_open"
version = "0.0.0"
description = "PROTOTYPE, throwaway (ticket #31): the Fair Open pot program, built only to size it and unit-test its transaction check"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_open"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
