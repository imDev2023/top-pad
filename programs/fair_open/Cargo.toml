[package]
name = "fair_open"
version = "0.1.0"
description = "The Fair Open program: deposits, the open and the pot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_open"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
solana-security-txt.workspace = true
solana-instructions-sysvar.workspace = true
solana-sha256-hasher.workspace = true

[dev-dependencies]
# The fee program, whose `register_fair_open_coin` the open calls: its types and its built binary.
fee = { path = "../fee", features = ["no-entrypoint"] }
# Our stand-in for DBC, whose made-up price and fees the open's tests check against.
dbc_stand_in = { path = "../../tests/dbc-stand-in", features = ["no-entrypoint"] }
# The precompiles, so a deposit's admission is verified by the real Ed25519 precompile.
litesvm = { workspace = true, features = ["precompiles"] }
solana-message.workspace = true
solana-transaction.workspace = true
solana-signer.workspace = true
solana-keypair.workspace = true
solana-account.workspace = true
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
