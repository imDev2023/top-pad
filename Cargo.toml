[workspace]
members = ["programs/*", "tests/dbc-stand-in"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anchor-lang = "1.2.1"
solana-security-txt = "1.1.3"
solana-instructions-sysvar = "3.0.1"
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.4.0"
serde_json = "1.0.154"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
