name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint (with the rule that keeps web3.js v1 inside packages/meteora), typecheck, and the unit tests against a real
  # Postgres (spec 10.4). The devnet tests (`pnpm test:devnet`) read the chain and run by hand, not here.
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The generated clients match the pinned IDLs: regenerating changes nothing.
      - run: pnpm clients && git diff --exit-code packages/clients/src/generated
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/postgres

  # `anchor build` of both programs with their ids, then their LiteSVM unit tests (spec 5.1). No Meteora program binary
  # is ever loaded: the tests run our programs only.
  programs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # SBPF v2, the newest devnet and mainnet run; Anchor 1.2.1 defaults to v3, which neither has activated.
      ANCHOR_BUILD_SBF_ARCH: v2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor 1.2.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" https://github.com/otter-sec/anchor/releases/download/v1.2.1/anchor-1.2.1-x86_64-unknown-linux-gnu
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      # Our stand-ins for DBC's partner fee claim, pool creation and swap, and for Jupiter Lock's escrow, which the
      # programs' tests load in their places; never deployed. Before `anchor build`, whose IDL build compiles those tests,
      # and they embed them.
      - run: cargo build-sbf --manifest-path tests/dbc-stand-in/Cargo.toml --tools-version v1.57 --arch v2
      - run: cargo build-sbf --manifest-path tests/lock-stand-in/Cargo.toml --tools-version v1.57 --arch v2
      - run: anchor build
      # The committed IDLs are what the generated clients came from: the programs' own build must not change them.
      - run: cp target/idl/fee.json target/idl/fair_open.json packages/clients/idl/ && git diff --exit-code packages/clients/idl
      # After the build, since the tests embed the built programs.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
